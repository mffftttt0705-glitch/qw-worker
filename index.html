            <h3>👤 ${u.username} 详情</h3>
            <div style="text-align:left;">
                <div class="detail-row"><span class="label">角色</span><span class="value">${u.role}</span></div>
                <div class="detail-row"><span class="label">红钻</span><span class="value">${u.diamond||0}</span></div>
                <div class="detail-row"><span class="label">冻结红钻</span><span class="value">${u.frozen_diamond||0}</span></div>
                <div class="detail-row"><span class="label">状态</span><span class="value">${u.status}</span></div>
                <div class="detail-row"><span class="label">总订单</span><span class="value">${stats.total_orders||0}</span></div>
                <div class="detail-row"><span class="label">已完成</span><span class="value">${stats.completed_orders||0}</span></div>
                <div class="detail-row"><span class="label">总消费</span><span class="value">${stats.total_spent||0} 红钻</span></div>
                <div class="detail-row"><span class="label">总收入</span><span class="value">${stats.total_earned||0} 红钻</span></div>
            </div>
            <div style="border-top:1px solid var(--border-color);padding-top:12px;text-align:left;">
                <div style="font-weight:600;margin-bottom:8px;">订单记录</div>
                <div style="max-height:150px;overflow-y:auto;font-size:13px;">${ordersHtml}</div>
            </div>
            <div style="border-top:1px solid var(--border-color);padding-top:12px;">
                <div class="admin-form-group"><label>操作红钻</label>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <input class="admin-form-control" id="adminDiamondAmount" type="number" placeholder="数量" style="flex:1;min-width:80px;" />
                        <button class="btn btn-success btn-sm" onclick="adminAddDiamond('${userId}')">增加</button>
                        <button class="btn btn-danger btn-sm" onclick="adminSubtractDiamond('${userId}')">扣除</button>
                    </div>
                </div>
            </div>
            <div class="btn-row"><button class="btn btn-outline" onclick="closeCustomModal()">关闭</button></div>
        `);
    } catch (err) { toast(err.message, 'error'); }
}
async function adminAddDiamond(userId) {
    const amount = parseInt(document.getElementById('adminDiamondAmount').value);
    if (!amount || amount < 1) return toast('请输入有效数量', 'warning');
    try { await apiRequest('/admin/users/diamond', { method: 'POST', body: { targetUserId: userId, amount, action: 'add' } }); toast('增加成功', 'success'); closeCustomModal(); renderAdminUsers(); } catch(err) { toast(err.message, 'error'); }
}
async function adminSubtractDiamond(userId) {
    const amount = parseInt(document.getElementById('adminDiamondAmount').value);
    if (!amount || amount < 1) return toast('请输入有效数量', 'warning');
    confirmAction('确认扣除', `确认扣除 ${amount} 红钻？`, '确认扣除', `doAdminSubtractDiamond('${userId}', ${amount})`);
}
async function doAdminSubtractDiamond(userId, amount) {
    try { await apiRequest('/admin/users/diamond', { method: 'POST', body: { targetUserId: userId, amount, action: 'subtract' } }); toast('扣除成功', 'success'); closeCustomModal(); renderAdminUsers(); } catch(err) { toast(err.message, 'error'); }
}

async function renderAdminRecharges() {
    try {
        const recharges = await apiRequest('/admin/recharges/pending');
        const container = document.getElementById('rechargesContent');
        if (recharges.length === 0) {
            container.innerHTML = '<div class="admin-card"><div class="admin-card-title"><i class="fas fa-coins"></i> 充值审核</div><div class="empty-state"><p>暂无待审核充值</p></div></div>';
            return;
        }
        let html = '<div class="admin-card"><div class="admin-card-title"><i class="fas fa-coins"></i> 充值审核</div><div class="table-wrap"><table><thead><tr><th>用户</th><th>金额</th><th>红钻</th><th>操作</th></tr></thead><tbody>';
        recharges.forEach(r => {
            html += `<tr><td>${r.username||r.user_id}</td><td>¥${r.amount}</td><td>${r.diamond}</td><td><button class="btn btn-success btn-xs" onclick="serviceApproveRecharge('${r.id}')">通过</button> <button class="btn btn-danger btn-xs" onclick="serviceRejectRecharge('${r.id}')">拒绝</button></td></tr>`;
        });
        html += '</tbody></table></div></div>';
        container.innerHTML = html;
    } catch (err) { console.error(err); }
}

async function renderAdminWithdraws() {
    try {
        const withdraws = await apiRequest('/admin/withdraws');
        const container = document.getElementById('withdrawsContent');
        const pending = withdraws.filter(w => w.status === 'pending');
        if (pending.length === 0) {
            container.innerHTML = '<div class="admin-card"><div class="admin-card-title"><i class="fas fa-money-bill-wave"></i> 提现审核</div><div class="empty-state"><p>暂无待审核提现</p></div></div>';
            return;
        }
        let html = '<div class="admin-card"><div class="admin-card-title"><i class="fas fa-money-bill-wave"></i> 提现审核</div><div class="table-wrap"><table><thead><tr><th>用户</th><th>金额</th><th>账号</th><th>操作</th></tr></thead><tbody>';
        pending.forEach(w => {
            html += `<tr><td>${w.username||w.user_id}</td><td>${w.amount} 红钻</td><td>${w.account_info||'-'}</td><td><button class="btn btn-success btn-xs" onclick="serviceApproveWithdraw('${w.id}')">通过</button> <button class="btn btn-danger btn-xs" onclick="serviceRejectWithdraw('${w.id}')">拒绝</button></td></tr>`;
        });
        html += '</tbody></table></div></div>';
        container.innerHTML = html;
    } catch (err) { console.error(err); }
}

// ============================================================
//  充值功能
// ============================================================
window.openRecharge = function() {
    if (!currentUser) { toast('请先登录', 'warning'); return; }
    showCustomModal(`
        <h3><i class="fas fa-plus-circle"></i> 充值红钻</h3>
        <p style="color:var(--text-muted);font-size:14px;">1元 = 10红钻，提交后等待客服审核</p>
        <div class="form-group"><label>充值金额（元）</label><input class="admin-form-control" id="rechargeAmount" type="number" placeholder="输入金额" min="1" /></div>
        <div style="text-align:center;margin:8px 0;"><span style="font-size:20px;font-weight:700;color:#f5c842;" id="rechargePreview">0 红钻</span></div>
        <div class="btn-row">
            <button class="btn btn-outline" onclick="closeCustomModal()">取消</button>
            <button class="btn btn-success" onclick="submitCustomRecharge()">提交申请</button>
        </div>
    `);
    document.getElementById('rechargeAmount').addEventListener('input', function() {
        const amount = parseFloat(this.value) || 0;
        document.getElementById('rechargePreview').textContent = Math.floor(amount * 10) + ' 红钻';
    });
};
async function submitCustomRecharge() {
    const amount = parseFloat(document.getElementById('rechargeAmount').value);
    if (!amount || amount < 1) return toast('请输入有效金额', 'warning');
    try { await apiRequest('/recharge/custom', { method: 'POST', body: JSON.stringify({ amount }) }); closeCustomModal(); toast('充值申请已提交', 'success'); } catch(err) { toast(err.message, 'error'); }
}

// ============================================================
//  打赏功能
// ============================================================
async function loadTipHandlers() {
    if (!currentUser) return;
    try {
        const users = await apiRequest('/admin/users');
        const handlers = users.filter(u => u.role === 'handler' && u.status === 'active');
        const sel = document.getElementById('tipHandlerSelect');
        sel.innerHTML = '<option value="">-- 请选择打手 --</option>';
        handlers.forEach(h => { sel.innerHTML += `<option value="${h.id}">${h.username}</option>`; });
    } catch (err) { console.error(err); }
}
window.sendTip = function() {
    if (!currentUser) { toast('请先登录', 'warning'); return; }
    const handlerId = document.getElementById('tipHandlerSelect').value;
    const amount = parseInt(document.getElementById('tipAmount').value);
    if (!handlerId) return toast('请选择打手', 'warning');
    if (!amount || amount < 1) return toast('请输入有效红钻数量', 'warning');
    confirmAction('确认打赏', `确认打赏 ${amount} 红钻给该打手？`, '确认打赏', `doSendTip('${handlerId}', ${amount})`);
};
async function doSendTip(handlerId, amount) {
    try { await apiRequest('/tip', { method: 'POST', body: JSON.stringify({ handlerId, amount }) }); toast('打赏成功！', 'success'); document.getElementById('tipAmount').value = ''; renderProducts(); updateHeaderDiamond(); } catch(err) { toast(err.message, 'error'); }
}

// ============================================================
//  红点更新
// ============================================================
async function updateBadges() {
    if (!currentUser) return;
    try {
        const result = await apiRequest('/messages/unread');
        const unread = result.unread || 0;
        const badge = document.getElementById('msgBadge');
        if (unread > 0) { badge.style.display = 'inline-block'; badge.textContent = unread > 99 ? '99+' : unread; } else { badge.style.display = 'none'; }
    } catch (e) {}
}

// ============================================================
//  导航切换
// ============================================================
document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
    item.addEventListener('click', function() {
        if (!currentUser && this.dataset.target !== 'home' && this.dataset.target !== 'account') { toast('请先登录', 'warning'); return; }
        const target = this.dataset.target;
        if (this.style.display === 'none') return;
        document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const viewMap = { 'home': 'view-home', 'orders': 'view-orders', 'handler': 'view-handler', 'dispatcher': 'view-dispatcher', 'service': 'view-service', 'admin': 'view-admin', 'messages': 'view-messages', 'account': 'view-account' };
        const viewId = viewMap[target];
        if (viewId) {
            document.getElementById(viewId).classList.add('active');
            if (target === 'orders') loadOrders();
            else if (target === 'handler') renderHandlerView();
            else if (target === 'dispatcher') renderDispatcherView();
            else if (target === 'service') renderServiceView();
            else if (target === 'admin') renderAdminAll();
            else if (target === 'messages') loadContacts();
            else if (target === 'account') updateAccountInfo();
        }
    });
});

// ============================================================
//  初始化
// ============================================================
async function init() {
    document.getElementById('authPage').style.display = 'none';
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('authStatusText').textContent = '未登录';
    document.getElementById('headerDiamond').textContent = '0';
    document.getElementById('headerUnreadMail').textContent = '0';
    loadCategories();
    const savedToken = localStorage.getItem('token');
    if (savedToken) {
        token = savedToken;
        try {
            const user = await apiRequest('/me');
            currentUser = user;
            document.getElementById('authStatusText').textContent = user.username;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-home').classList.add('active');
            document.querySelector('.bottom-nav .nav-item[data-target="home"]').classList.add('active');
            updateRoleBasedUI();
            updateAccountInfo();
            loadCategories();
            renderProducts();
            renderHandlerView();
            renderDispatcherView();
            renderServiceView();
            renderAdminAll();
            loadContacts();
            loadTipHandlers();
            updateHeaderDiamond();
            updateBadges();
            requestNotificationPermission();
            if (window._badgeTimer) clearInterval(window._badgeTimer);
            window._badgeTimer = setInterval(updateBadges, 30000);
        } catch (err) {
            localStorage.removeItem('token');
            token = null;
            currentUser = null;
            document.getElementById('authStatusText').textContent = '未登录';
        }
    }
    // 注册Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(() => console.log('✅ SW注册成功')).catch(() => console.log('❌ SW注册失败'));
        });
    }
}
init();
console.log('✅ QW电竞平台已加载');
</script>
